{% extends "main/base.html" %}
{% load static %}

{% block title %}
    <title>Банк Онлайн | Вход</title>
{% endblock title %}

{% block note %}
    <p>Ваш финансовый партнер</p>
{% endblock note %}

{% block form %}
    <h2>Вход в личный кабинет</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="login-btn">
            <i class="fas fa-sign-in-alt"></i> Войти
        </button>
    </form>
    <div class="additional-links">
        <a href="{% url "main:registration" %}"><i class="fas fa-user-plus"></i> Регистрация</a>
    </div>
{% endblock form %}
