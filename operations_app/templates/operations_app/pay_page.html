{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платеж</title>
    <!-- Подключение нашего файла стилей -->
    <link rel="stylesheet" href="{% static "css/style_pay_page.css" %}">
</head>
<body class="bg">
    <div class="full-page-container">
        <h1>Страница оплаты</h1>
        <h2>{{ operation_title }}</h2>
        <form method="post">
            {% csrf_token %}
            <input type="number" name="input_field" required>

            <button class="change-money" type="submit" value={{ operation_type }} name="action">
                <p>{{ operation_button }}</p>
            </button>
        </form>
        <a href="{% url "main:menu" %}" class="exit-btn">Выход🔙</a>
    </div>
</body>
</html>
