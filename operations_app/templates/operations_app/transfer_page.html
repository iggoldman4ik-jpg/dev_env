{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перевод</title>
    <!-- Подключение нашего файла стилей -->
    <link rel="stylesheet" href="{% static "css/style_pay_page.css" %}">
</head>
<body class="bg">
    <div class="full-page-container">
        <h1>Страница перевода</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="recipient">Пользователь (логин)</label>
                <input type="text" id="recipient" name="recipient" required>
            </div>
            
            <div class="form-group">
                <label for="amount">Сумма перевода (₽)</label>
                <input type="number" id="amount" name="amount" required min="1">
            </div>

            <button class="change-money" type="submit" value="transfer" name="action">
                <p>Перевести</p>
            </button>
        </form>
        <a href="{% url "main:menu" %}" class="exit-btn">Выход🔙</a>
    </div>
</body>
</html>
