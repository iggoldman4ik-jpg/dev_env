<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банк Онлайн | Вход</title>
    <link rel="stylesheet" href="deps/css/style_main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="full-page-container">
        <div class="background-overlay"></div>
        
        <div class="content-wrapper">
            <div class="logo-section">
                <div class="logo">
                    <h1>БАНК Онлайн</h1>
                </div>
                <p>Ваш финансовый партнер</p>
            </div>
            
            <div class="login-container">
                <div class="login-box">
                    <h2>Вход в личный кабинет</h2>
                    <form>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="username" name="username" placeholder="Введите логин" required>
                        </div>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                        </div>
                        <button type="submit" class="login-btn">
                            <i class="fas fa-sign-in-alt"></i> Войти
                        </button>
                    </form>
                    <div class="additional-links">
                        <a href="http://127.0.0.1:5500/registr/registration.html"><i class="fas fa-user-plus"></i> Регистрация</a>
                    </div>
                </div>
            </div>
            
            <div class="security-info">
                <i class="fas fa-shield-alt"></i>
                <p>Ваша безопасность - наш приоритет</p>
            </div>
        </div>
    </div>
</body>
</html>
